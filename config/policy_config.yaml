# policy_config.yaml — Revenue Recovery Decision Engine
# Guardrail thresholds for the policy engine.

policy:
  version: "1.0.0"

  intervention_cost: 15.00         # Estimated cost per retry attempt (INR)

  guardrails:
    max_retry_count: 3             # Maximum retries allowed per payment
    recovery_window_hours: 72       # Hours after failure within which retry is allowed
    min_confidence: 0.05            # Minimum P(recovery) to permit RETRY
    min_erv: 0.00                   # Minimum Expected Recovery Value (INR) to permit RETRY
    high_value_threshold: 100000.00 # Amount (INR) above which ESCALATE is required for ambiguous cases
    low_value_threshold: 100.00     # Amount (INR) below which DO_NOTHING is preferred

  failure_reason_blocklist:         # Failure reasons that unconditionally block RETRY
    - "account_closed"
    - "card_permanently_blocked"
    - "suspected_fraud"
    - "velocity_check_failed"
